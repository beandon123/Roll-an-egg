<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #9ec9ea; overflow: hidden; font: 14px system-ui, sans-serif; }
  canvas { display: block; }
  #zones { position: fixed; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #zones button { border: 0; border-radius: 6px; padding: 6px 10px; background: rgba(20, 24, 32, 0.75); color: #fff; cursor: pointer; }
</style>
<div id="zones"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const DATA = /*MAP_DATA*/null;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const sky = new THREE.Color("#a9d4f2");
  scene.background = sky;
  scene.fog = new THREE.Fog(sky, 260, 900);
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 3000);

  scene.add(new THREE.HemisphereLight("#e8f4ff", "#6b5a44", 0.75));
  const sun = new THREE.DirectionalLight("#fff6e4", 0.85);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  sun.shadow.bias = -0.0006;
  scene.add(sun);
  scene.add(sun.target);

  // Shapes as Roblox makes them.
  const BOX = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
  const WEDGE = (() => {
    const p = [[-0.5, -0.5, -0.5], [0.5, -0.5, -0.5], [-0.5, -0.5, 0.5], [0.5, -0.5, 0.5], [-0.5, 0.5, 0.5], [0.5, 0.5, 0.5]];
    const faces = [[0, 1, 3], [0, 3, 2], [2, 3, 5], [2, 5, 4], [0, 4, 5], [0, 5, 1], [0, 2, 4], [1, 5, 3]];
    const verts = [];
    for (const f of faces) for (const i of f) verts.push(...p[i]);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
    g.computeVertexNormals();
    return g;
  })();
  const BALL = new THREE.SphereGeometry(0.5, 16, 12).toNonIndexed();
  // Roblox cylinders run along X.
  const CYLINDER = new THREE.CylinderGeometry(0.5, 0.5, 1, 18).rotateZ(Math.PI / 2).toNonIndexed();

  // Merge every part into one mesh per look, so thousands of parts draw quickly.
  const buckets = new Map();
  const matrix = new THREE.Matrix4();
  const normalMatrix = new THREE.Matrix3();
  const v = new THREE.Vector3();
  for (const p of DATA.parts) {
    const [shape, x, y, z, r00, r01, r02, r10, r11, r12, r20, r21, r22, sx, sy, sz, hex, material, transparency] = p;
    let geometry = BOX, scale = [sx, sy, sz];
    if (shape === "Wedge") geometry = WEDGE;
    else if (shape === "Ball") { geometry = BALL; const d = Math.min(sx, sy, sz); scale = [d, d, d]; }
    else if (shape === "Cylinder") { geometry = CYLINDER; const d = Math.min(sy, sz); scale = [sx, d, d]; }
    const key = hex + "|" + material + "|" + transparency;
    if (!buckets.has(key)) buckets.set(key, { hex, material, transparency, positions: [], normals: [] });
    const bucket = buckets.get(key);
    matrix.set(r00 * scale[0], r01 * scale[1], r02 * scale[2], x,
               r10 * scale[0], r11 * scale[1], r12 * scale[2], y,
               r20 * scale[0], r21 * scale[1], r22 * scale[2], z,
               0, 0, 0, 1);
    normalMatrix.getNormalMatrix(matrix);
    const pos = geometry.attributes.position, nor = geometry.attributes.normal;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(matrix);
      bucket.positions.push(v.x, v.y, v.z);
      v.fromBufferAttribute(nor, i).applyMatrix3(normalMatrix).normalize();
      bucket.normals.push(v.x, v.y, v.z);
    }
  }
  for (const bucket of buckets.values()) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(bucket.positions, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(bucket.normals, 3));
    const color = new THREE.Color(bucket.hex).convertSRGBToLinear();
    let m;
    if (bucket.material === "Neon") {
      m = new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(1.4) });
    } else if (bucket.material === "Glass" || bucket.material === "Ice" || bucket.transparency > 0) {
      m = new THREE.MeshPhongMaterial({ color, shininess: 90, transparent: bucket.transparency > 0, opacity: 1 - bucket.transparency, depthWrite: bucket.transparency < 0.3 });
    } else {
      m = new THREE.MeshLambertMaterial({ color });
    }
    const mesh = new THREE.Mesh(g, m);
    mesh.castShadow = bucket.material !== "Neon" && bucket.transparency < 0.3;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }

  // Camera: from the address, or looking down a zone from just behind its gate.
  const target = new THREE.Vector3();
  function zoneView(id) {
    if (id === 0) {
      // The hub: the plaza with the plots down both sides.
      camera.position.set(0, DATA.baseY + 130, -470);
      target.set(0, DATA.baseY, -190);
      return;
    }
    const zone = DATA.zones[id - 1];
    camera.position.set(0, DATA.baseY + 28, zone.startZ + 6);
    target.set(0, DATA.baseY, zone.startZ + 190);
  }
  function fromHash() {
    const hash = new URLSearchParams(location.hash.slice(1));
    if (hash.get("cam")) {
      const c = hash.get("cam").split(",").map(Number);
      camera.position.set(c[0], c[1], c[2]);
      target.set(c[3], c[4], c[5]);
    } else {
      zoneView(Number(hash.has("zone") ? hash.get("zone") : 1));
    }
    if (hash.get("fov")) camera.fov = Number(hash.get("fov"));
    camera.updateProjectionMatrix();
  }
  fromHash();
  window.addEventListener("hashchange", () => { fromHash(); draw(); });

  const buttons = document.getElementById("zones");
  {
    const b = document.createElement("button");
    b.textContent = "Hub";
    b.onclick = () => { location.hash = "zone=0"; };
    buttons.appendChild(b);
  }
  for (const zone of DATA.zones) {
    const b = document.createElement("button");
    b.textContent = zone.name;
    b.onclick = () => { location.hash = "zone=" + zone.id; };
    buttons.appendChild(b);
  }
  if (new URLSearchParams(location.hash.slice(1)).get("clean")) buttons.style.display = "none";

  // Drag to turn, wheel to move forward and back.
  let dragging = null;
  renderer.domElement.addEventListener("pointerdown", (e) => { dragging = [e.clientX, e.clientY]; });
  window.addEventListener("pointerup", () => { dragging = null; });
  window.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = (e.clientX - dragging[0]) * 0.005, dy = (e.clientY - dragging[1]) * 0.005;
    dragging = [e.clientX, e.clientY];
    const offset = target.clone().sub(camera.position);
    offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), -dx);
    offset.y -= dy * offset.length();
    target.copy(camera.position).add(offset);
    draw();
  });
  window.addEventListener("wheel", (e) => {
    const step = target.clone().sub(camera.position).normalize().multiplyScalar(-e.deltaY * 0.2);
    camera.position.add(step); target.add(step); draw();
  });

  function draw() {
    camera.lookAt(target);
    // The sun follows the view so shadows cover what is on screen.
    const focus = camera.position.clone().lerp(target, 0.6);
    sun.position.copy(focus).add(new THREE.Vector3(-120, 220, -90));
    sun.target.position.copy(focus);
    const extent = 240;
    Object.assign(sun.shadow.camera, { left: -extent, right: extent, top: extent, bottom: -extent, near: 1, far: 800 });
    sun.shadow.camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    document.body.dataset.ready = "1";
  }
  window.addEventListener("resize", () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    draw();
  });
  draw();
})();
</script>
</html>
